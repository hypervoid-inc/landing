name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Scheduled publishing (docs/scheduled-publishing.md): a full rebuild every
  # morning, plus a check every quarter hour that deploys only when a post's
  # go-live time has passed and the live site does not have it yet.
  schedule:
    - cron: "5 0 * * *"
    - cron: "7,22,37,52 * * * *"
  # "Run workflow" in the Actions tab republishes on demand.
  workflow_dispatch:

# Scheduled runs queue rather than cancel, so a check never kills a deploy in
# progress; pushes and pull requests still cancel their own stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || 'run' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  due:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/content/blog
            scripts/due-posts.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: check
        run: node scripts/due-posts.mjs ${{ github.event.schedule == '5 0 * * *' && '--always' || '' }} >> "$GITHUB_OUTPUT"

  ci:
    needs: due
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.due.outputs.publish == 'true') }}
    # One deploy of main at a time, whichever event started it.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # Build once with dummy Turnstile for e2e (not thrice: check + e2e + deploy).
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Build for e2e
        run: pnpm build
        env:
          VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      - run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: "1"
      - name: Production build
        if: github.ref == 'refs/heads/main'
        run: pnpm build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      # IndexNow submits what changed between the live sitemap and this one.
      - name: Snapshot live sitemap
        if: github.ref == 'refs/heads/main'
        run: curl -fsS https://construct.computer/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" || true
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        run: npx wrangler pages deploy build/client --project-name landing-new --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5d7aa603ebe193d63efb09a759c0c3ed
      - name: Submit changed pages to IndexNow
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow.mjs "$RUNNER_TEMP/live-sitemap.xml"
