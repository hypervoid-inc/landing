version: 2
updates:
  # PostHog npm packages only — lockfiles pin exact versions, so `pnpm install`
  # never picks up new SDKs. Weekly PRs, human review, no automerge (PostHog
  # Shai-Hulud guidance). GitHub's default 3-day cooldown applies.
  # https://posthog.com/docs/health-checks/keeping-sdks-current
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "posthog-js"
      - dependency-name: "@posthog/*"
    groups:
      posthog:
        patterns:
          - "posthog-js"
          - "@posthog/*"
    open-pull-requests-limit: 5
