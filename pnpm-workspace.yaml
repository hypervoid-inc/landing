trustPolicy: no-downgrade
trustPolicyExclude:
  # Babel still depends on this established release, published before npm provenance.
  - semver@6.3.1
minimumReleaseAgeExclude:
  # PostHog SDK Health update; exact versions reviewed before normal maturity.
  - posthog-js@1.409.5
  - "@posthog/browser-common@0.3.1"
  - "@posthog/core@1.46.1"
  - "@posthog/types@1.399.0"
  # Security fix for GHSA-qwww-vcr4-c8h2; reviewed before the normal maturity window.
  - react-router@8.3.0
  - "@react-router/dev@8.3.0"
  - "@react-router/node@8.3.0"
  # Security fix for GHSA-mh99-v99m-4gvg; pinned by the override below.
  - brace-expansion@5.0.8
overrides:
  brace-expansion: 5.0.8
  sharp: 0.35.3
